# Hourly Google Calendar sync (Vercel's free plan only allows a daily cron).
# Needs two repository secrets: SITE_URL (e.g. https://yourchapter.org) and CRON_SECRET.
name: Sync Google Calendar
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the sync endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Secrets not set; skipping."; exit 0; fi
          curl --fail-with-body -sS -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/sync-calendar"
